[project]
name = "smbmc"
dynamic = ["version"]
description = "Supermicro BMC interface"
authors = [
    {name="George Rawlinson", email="george@rawlinson.net.nz"},
]
repository = "https://github.com/grawlinson/smbmc"
documentation = "https://smbmc.readthedocs.io"
readme = "README.rst"
license = {text="GPL-3.0-only"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = []

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.maturin]
# The version comes from the Cargo workspace (single source of truth).
manifest-path = "crates/smbmc-py/Cargo.toml"
python-source = "src"
module-name = "smbmc._smbmc"
features = ["pyo3/extension-module"]

[tool.uv]
# Rebuild the extension when the Rust sources change.
cache-keys = [
    {file = "pyproject.toml"},
    {file = "Cargo.toml"},
    {file = "Cargo.lock"},
    {file = "crates/**/Cargo.toml"},
    {file = "crates/**/*.rs"},
]

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "docs"},
    {include-group = "test"},
]
lint = [
    "ruff>=0.15.22",
]
docs = [
    "sphinx>=8.1.3",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-rtd-theme>=3.1.0",
]
test = [
    "pytest-httpserver>=1.1.0",
    "coverage>=7.15.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest]
minversion = "9.0"
addopts = [
    "--import-mode=importlib",
    "-v",
]
testpaths = [
    "tests",
]

[tool.coverage.paths]
source = ["src"]

[tool.coverage.run]
branch = true
source = ["smbmc"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    # flake8-annotations
    "ANN",
    # flake8-builtins
    "A",
    # flake8-pytest-style
    "PT",
    # pep8-naming
    "N",
    # flake8-datetimez
    "DTZ",
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # ruff
    "RUF",
    # mccabe
    "C90",
]

[tool.ruff.lint.per-file-ignores]
"**/{tests,docs}/*" = ["ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
