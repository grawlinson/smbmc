[project]
name = "smbmc"
version = "0.2.0"
description = "Supermicro BMC interface"
authors = [
    {name="George Rawlinson", email="<george@rawlinson.net.nz>",},
]
repository = "https://github.com/grawlinson/smbmc"
documentation = "https://smbmc.readthedocs.io"
readme = "README.rst"
license = {text="GPL-3.0-only"}
requires-python = ">= 3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
  "requests>=2.24.0",
  "defusedxml>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "docs"},
  {include-group = "test"},
]
lint = [
    "ruff>=0.15.22",
]
docs = [
    "sphinx>=8.1.3",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-rtd-theme>=3.1.0",
]
test = [
    "betamax>=0.9.0",
    "coverage>=7.15.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest]
minversion = "9.0"
addopts = [
    "--import-mode=importlib",
    "-v",
]
testpaths = [
    "tests",
]

[tool.coverage.paths]
source = ["src"]

[tool.coverage.run]
branch = true
source = ["smbmc"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    # flake8-annotations
    "ANN",
    # flake8-builtins
    "A",
    # flake8-pytest-style
    "PT",
    # pep8-naming
    "N",
    # flake8-datetimez
    "DTZ",
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # ruff
    "RUF",
    # mccabe
    "C90",
]

[tool.ruff.lint.per-file-ignores]
"**/{tests,docs}/*" = ["ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
